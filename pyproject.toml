[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reframe"
version = "1.0.0"
description = "From legacy source to reviewed requirements, business rules and a design to build from, with Claude, or Claude and AWS Transform; tested on mainframe code"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Satish Kumar Nampally" }]
keywords = ["mainframe", "cobol", "modernization", "legacy", "reverse-engineering", "requirements", "claude", "aws-transform", "ai-dlc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Documentation",
]
dependencies = ["mcp>=2,<3", "PyYAML>=6,<7", "rich>=13,<15"]

[project.optional-dependencies]
# what CI checks with (the lint job and the coverage floor); pinned so a new release of a checker cannot fail a PR
dev = ["ruff==0.17.6", "mypy==2.4.1", "types-PyYAML==6.0.12.20261122", "coverage==7.15.4"]

[project.urls]
Homepage = "https://github.com/CodeStrata/reframe"
Documentation = "https://github.com/CodeStrata/reframe/blob/main/docs/how-to-run.md"
Examples = "https://codestrata.github.io/reframe/"
Changelog = "https://github.com/CodeStrata/reframe/blob/main/CHANGELOG.md"
Issues = "https://github.com/CodeStrata/reframe/issues"

[project.scripts]
reframe = "reframe.core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"reframe.infrastructure" = ["terraform/*/*.tf", "terraform/modules/*/*.tf"]
"reframe.report" = ["template.html", "compare.html"]
"reframe.design" = ["prototype.html"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# correctness, not style: pyflakes, syntax and statement errors, and bugbear
select = ["E4", "E7", "E9", "F", "B"]
# E731 (a lambda given a name) and E741 (a variable named l) are style; B905 (zip without strict=) would change behaviour
ignore = ["E731", "E741", "B905"]

[tool.coverage.run]
source = ["reframe"]

[tool.coverage.report]
# the floor CI holds (Q1-04): raise it as tests are added, never lower it
fail_under = 80

[tool.mypy]
python_version = "3.10"
files = ["src/reframe"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

# Modules with type errors still to fix (Q1-03, Q1-06). The list only shrinks: take a module off once it is clean.
# `reframe.core.commands` comes off once Q1-05 has split it.
[[tool.mypy.overrides]]
module = ["reframe.core.commands"]
ignore_errors = true
