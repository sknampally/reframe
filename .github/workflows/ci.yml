name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the project
        run: python -m pip install -e .
      - name: Run offline tests
        run: PYTHONPATH=tests python -m unittest discover -s tests
      - name: Check the CLI
        run: reframe --help

  package:
    name: Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build the distribution
        run: |
          python -m pip install build
          python -m build
      - name: Check packaged modules
        run: |
          python - <<'PY'
          import tarfile
          import tomllib
          import zipfile
          from pathlib import Path

          root = Path('.')
          modules = tomllib.loads((root / 'pyproject.toml').read_text())['tool']['setuptools']['py-modules']
          wheel = next((root / 'dist').glob('*.whl'))
          sdist = next((root / 'dist').glob('*.tar.gz'))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
              entry = archive.read(next(name for name in names if name.endswith('entry_points.txt'))).decode()
          missing = [module for module in modules if f'{module}.py' not in names]
          if missing:
              raise SystemExit(f'wheel missing modules: {missing}')
          if 'reframe = reframe:main' not in entry:
              raise SystemExit('wheel is missing the reframe console script')
          with tarfile.open(sdist) as archive:
              packaged = {member.name.split('/')[-1] for member in archive.getmembers()}
          missing = [f'{module}.py' for module in modules if f'{module}.py' not in packaged]
          if missing:
              raise SystemExit(f'sdist missing modules: {missing}')
          print(f'validated {wheel.name} and {sdist.name} ({len(modules)} modules)')
          PY
      - name: Install the wheel and check the CLI
        run: |
          python -m venv "${RUNNER_TEMP}/dist-check"
          "${RUNNER_TEMP}/dist-check/bin/python" -m pip install dist/*.whl
          "${RUNNER_TEMP}/dist-check/bin/reframe" --help

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan with pinned gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          asset="gitleaks_${version}_linux_x64.tar.gz"
          expected=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${asset}" \
            --output "${RUNNER_TEMP}/${asset}"
          echo "${expected}  ${RUNNER_TEMP}/${asset}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${asset}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version
          "${RUNNER_TEMP}/gitleaks" detect --source . --redact --exit-code 1
