[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reframe"
version = "0.3.0"
description = "Reverse-engineer mainframe source into an AI-DLC handoff for any language"
requires-python = ">=3.10"
dependencies = ["mcp>=2,<3", "rich>=13,<15", "prompt-toolkit>=3.0,<4"]

[project.scripts]
reframe = "reframe:main"

[tool.setuptools]
py-modules = ["reframe_flow", "reframe_workspace", "reframe_checkpoints", "reframe_preview", "reframe_terminal", "reframe", "reframe_setup", "reframe_models", "reframe_artifacts", "reframe_source", "reframe_contracts", "kiro_workflow", "pilot"]
package-dir = {"" = "scripts"}
