<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">How Reframe orchestrates the work</title>
  <desc id="desc">Mainframe source goes into the Reframe orchestrator, which provides routing, state, governance and traceability. The orchestrator drives an AWS Transform assessment, records approvals from people, and hands bounded evidence to three AI agents: the executor, the reviewer and the wireframe agent. It writes an AI-DLC package as output.</desc>

  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="640" rx="16" fill="#ffffff"/>

  <!-- Connectors (drawn first so cards sit on top) -->
  <g stroke="#64748b" stroke-width="2" fill="none">
    <line x1="325" y1="112" x2="325" y2="148" marker-start="url(#head)" marker-end="url(#head)"/>
    <line x1="635" y1="112" x2="635" y2="148" marker-start="url(#head)" marker-end="url(#head)"/>
    <line x1="172" y1="265" x2="198" y2="265" marker-end="url(#head)"/>
    <line x1="762" y1="265" x2="788" y2="265" marker-end="url(#head)"/>
  </g>
  <g font-size="11.5" fill="#64748b">
    <text x="333" y="135">MCP</text>
    <text x="643" y="135">approve · decide</text>
  </g>

  <!-- AWS Transform -->
  <rect x="200" y="20" width="250" height="92" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <rect x="200" y="20" width="6" height="92" rx="3" fill="#f97316"/>
  <g transform="translate(220 40)" fill="none" stroke="#c2410c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 26 H25 A6 6 0 0 0 26 14 A8.5 8.5 0 0 0 10.5 12.5 A7 7 0 0 0 9 26 Z"/>
  </g>
  <text x="262" y="50" font-size="16" font-weight="700" fill="#0f172a">AWS Transform</text>
  <text x="262" y="70" font-size="12.5" fill="#475569">Assesses code, data, rules</text>
  <text x="262" y="92" font-size="11.5" font-weight="600" fill="#c2410c">your account · private sandbox</text>

  <!-- People -->
  <rect x="510" y="20" width="250" height="92" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <rect x="510" y="20" width="6" height="92" rx="3" fill="#16a34a"/>
  <g transform="translate(530 40)" fill="none" stroke="#15803d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="13" cy="9" r="5"/>
    <path d="M3 29 a10 9 0 0 1 20 0"/>
    <circle cx="25" cy="11" r="3.5"/>
    <path d="M24 19 a8 7.5 0 0 1 8 8"/>
  </g>
  <text x="572" y="50" font-size="16" font-weight="700" fill="#0f172a">People</text>
  <text x="572" y="70" font-size="12.5" fill="#475569">Approve every phase</text>
  <text x="572" y="92" font-size="11.5" font-weight="600" fill="#15803d">a model PASS is not approval</text>

  <!-- Source in -->
  <rect x="20" y="210" width="152" height="110" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="96" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">IN</text>
  <text x="96" y="263" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Mainframe source</text>
  <text x="96" y="283" text-anchor="middle" font-size="12.5" fill="#475569">COBOL · CICS · JCL</text>
  <text x="96" y="301" text-anchor="middle" font-size="12.5" fill="#475569">pinned to a commit</text>

  <!-- Package out -->
  <rect x="788" y="210" width="152" height="110" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="864" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">OUT</text>
  <text x="864" y="263" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">AI-DLC package</text>
  <text x="864" y="283" text-anchor="middle" font-size="12.5" fill="#475569">specs · wireframes</text>
  <text x="864" y="301" text-anchor="middle" font-size="12.5" fill="#475569">tests · backlog</text>

  <!-- Orchestrator hub -->
  <rect x="200" y="150" width="560" height="232" rx="14" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
  <path d="M200 164 a14 14 0 0 1 14 -14 H746 a14 14 0 0 1 14 14 V206 H200 Z" fill="#1e293b"/>
  <text x="222" y="185" font-size="21" font-weight="700" fill="#ffffff">Reframe Orchestrator</text>
  <text x="738" y="184" text-anchor="end" font-size="12.5" fill="#cbd5e1">the reframe CLI on your workstation</text>

  <g fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2">
    <rect x="220" y="222" width="250" height="64" rx="10"/>
    <rect x="490" y="222" width="250" height="64" rx="10"/>
    <rect x="220" y="300" width="250" height="64" rx="10"/>
    <rect x="490" y="300" width="250" height="64" rx="10"/>
  </g>
  <g fill="none" stroke="#4338ca" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Routing: fork -->
    <g transform="translate(234 240)">
      <path d="M4 14 H11 M11 14 C15 14 15 5 21 5 H25 M11 14 C15 14 15 23 21 23 H25 M21 2 l4 3 l-4 3 M21 20 l4 3 l-4 3"/>
    </g>
    <!-- State: stacked layers -->
    <g transform="translate(504 240)">
      <path d="M14 3 L25 8.5 L14 14 L3 8.5 Z M3 14 L14 19.5 L25 14 M3 19.5 L14 25 L25 19.5"/>
    </g>
    <!-- Governance: gate / padlock -->
    <g transform="translate(234 318)">
      <rect x="5" y="12" width="18" height="14" rx="2.5"/>
      <path d="M9 12 V8 a5 5 0 0 1 10 0 V12 M14 17.5 v3.5"/>
    </g>
    <!-- Traceability: linked chain / document with lines -->
    <g transform="translate(504 318)">
      <path d="M7 3 H18 L23 8 V25 H7 Z M18 3 V8 H23 M11 13 h8 M11 17 h8 M11 21 h5"/>
    </g>
  </g>
  <g font-size="15" font-weight="700" fill="#0f172a">
    <text x="272" y="249">Routing</text>
    <text x="542" y="249">State</text>
    <text x="272" y="327">Governance</text>
    <text x="542" y="327">Traceability</text>
  </g>
  <g font-size="12.5" fill="#475569">
    <text x="272" y="268">Chooses the next phase</text>
    <text x="542" y="268">Resumable, hash-sealed runs</text>
    <text x="272" y="346">Approvals, call budget, sandbox</text>
    <text x="542" y="346">Cited rules, reports, spend</text>
  </g>

  <!-- Agents group -->
  <rect x="120" y="420" width="720" height="204" rx="14" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="145" y="611" font-size="11" font-weight="700" fill="#6d28d9" letter-spacing="1">AI AGENTS</text>
  <text x="227" y="611" font-size="11.5" fill="#7c3aed">no tools · JSON in, JSON out</text>
  <g stroke="#64748b" stroke-width="2" fill="none">
    <line x1="250" y1="384" x2="250" y2="456" marker-start="url(#head)" marker-end="url(#head)"/>
    <line x1="480" y1="384" x2="480" y2="456" marker-start="url(#head)" marker-end="url(#head)"/>
    <line x1="710" y1="384" x2="710" y2="456" marker-start="url(#head)" marker-end="url(#head)"/>
  </g>

  <g fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5">
    <rect x="145" y="458" width="210" height="130" rx="10"/>
    <rect x="375" y="458" width="210" height="130" rx="10"/>
    <rect x="605" y="458" width="210" height="130" rx="10"/>
  </g>
  <g fill="#7c3aed">
    <rect x="145" y="458" width="210" height="5" rx="2.5"/>
    <rect x="375" y="458" width="210" height="5" rx="2.5"/>
    <rect x="605" y="458" width="210" height="5" rx="2.5"/>
  </g>
  <g fill="none" stroke="#6d28d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Executor: pen on page -->
    <g transform="translate(161 474)">
      <path d="M5 4 H19 V28 H5 Z M9 10 h6 M9 14 h6"/>
      <path d="M17 26 L28 15 l3 3 L20 29 h-3 Z"/>
    </g>
    <!-- Reviewer: magnifier with check -->
    <g transform="translate(391 474)">
      <circle cx="14" cy="14" r="9"/>
      <path d="M21 21 L29 29 M10 14 l3 3 l5 -5.5"/>
    </g>
    <!-- Wireframe: screen layout -->
    <g transform="translate(621 474)">
      <rect x="2" y="5" width="28" height="22" rx="2.5"/>
      <path d="M2 11 h28 M14 11 V27 M18 16 h8 M18 20 h8"/>
    </g>
  </g>
  <g font-size="16" font-weight="700" fill="#0f172a">
    <text x="201" y="496">Executor</text>
    <text x="431" y="496">Reviewer</text>
    <text x="661" y="496">Wireframes</text>
  </g>
  <g font-size="13" fill="#334155">
    <text x="161" y="530">Drafts the specification</text>
    <text x="161" y="548">and cites every rule</text>
    <text x="391" y="530">Rechecks the evidence:</text>
    <text x="391" y="548">PASS · REWORK · BLOCKED</text>
    <text x="621" y="530">Screens, API reference</text>
    <text x="621" y="548">and OpenAPI contracts</text>
  </g>
  <g font-size="11.5" font-weight="600" fill="#6d28d9">
    <text x="161" y="574">Claude Sonnet · Codex · Kiro</text>
    <text x="391" y="574">Claude Opus</text>
    <text x="621" y="574">Claude · Codex</text>
  </g>
</svg>
