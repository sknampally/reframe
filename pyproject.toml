[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reframe"
version = "0.3.0"
description = "Reverse-engineer mainframe source into an AI-DLC handoff for any language"
requires-python = ">=3.10"
dependencies = ["mcp>=2,<3", "rich>=13,<15", "prompt-toolkit>=3.0,<4"]

[project.scripts]
reframe = "modernize:main"

[tool.setuptools]
py-modules = ["modernize_flow", "modernize_workspace", "modernize_checkpoints", "modernize_preview", "modernize_terminal", "modernize", "modernize_setup", "modernize_models", "modernize_artifacts", "modernize_source", "modernize_contracts", "kiro_workflow", "pilot"]
package-dir = {"" = "scripts"}
