<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img" aria-labelledby="title description">
<title id="title">Proposed mainframe modernization reference architecture</title>
<desc id="description">Three stages: pin source and extract candidate knowledge; orchestrate execution and independent review with bounded rework; obtain human approval before target implementation, equivalence verification, and a separate release decision. Missing evidence blocks advancement. This is a proposed architecture, not implemented automation.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker><marker id="blueArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#2563eb"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif} .title{font-size:30px;font-weight:700;fill:#0f172a}.sub{font-size:16px;fill:#475569}.head{font-size:19px;font-weight:700;fill:#0f172a}.body{font-size:15px;fill:#475569}.label{font-size:13px;fill:#475569}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.approve{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#blueArrow)}</style>
<rect width="1440" height="1050" rx="20" fill="#ffffff"/>
<text x="36" y="52" class="title">Evidence-driven modernization</text>
<text x="36" y="82" class="sub">Pinned source → independently reviewed decisions → human-controlled delivery</text>
<rect x="1195" y="26" width="209" height="36" rx="18" fill="#eff6ff"/><text x="1299" y="50" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">PROPOSED ARCHITECTURE</text>
<rect x="36" y="116" width="360" height="848" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
<circle cx="70" cy="154" r="16" fill="#0f172a"/>
<text x="70" y="159" text-anchor="middle" font-size="12" font-weight="700" fill="white">01</text>
<text x="96" y="160" text-anchor="start" class="head">Discover &amp; ground</text>
<text x="56" y="192" text-anchor="start" class="body">Source and evidence</text>
<rect x="416" y="116" width="620" height="848" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
<circle cx="450" cy="154" r="16" fill="#0f172a"/>
<text x="450" y="159" text-anchor="middle" font-size="12" font-weight="700" fill="white">02</text>
<text x="476" y="160" text-anchor="start" class="head">Execute &amp; challenge</text>
<text x="436" y="192" text-anchor="start" class="body">Bounded work, independent review</text>
<rect x="1056" y="116" width="348" height="848" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
<circle cx="1090" cy="154" r="16" fill="#0f172a"/>
<text x="1090" y="159" text-anchor="middle" font-size="12" font-weight="700" fill="white">03</text>
<text x="1116" y="160" text-anchor="start" class="head">Approve &amp; deliver</text>
<text x="1076" y="192" text-anchor="start" class="body">Human-controlled advancement</text>
<rect x="56" y="230" width="320" height="110" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="216.0" y="263" text-anchor="middle" class="head">Pinned mainframe source</text>
<text x="216.0" y="292" text-anchor="middle" class="body">COBOL · CICS/BMS · VSAM</text>
<text x="216.0" y="315" text-anchor="middle" class="body">JCL · Schedulers</text>
<rect x="56" y="425" width="320" height="120" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="216.0" y="458" text-anchor="middle" class="head">AWS Transform</text>
<text x="216.0" y="487" text-anchor="middle" class="body">Dependencies · Rule candidates</text>
<text x="216.0" y="510" text-anchor="middle" class="body">Data lineage · Documentation</text>
<rect x="56" y="630" width="320" height="140" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="216.0" y="663" text-anchor="middle" class="head">Private evidence baseline</text>
<text x="216.0" y="692" text-anchor="middle" class="body">Source revision · Tool outputs</text>
<text x="216.0" y="715" text-anchor="middle" class="body">Traceability · Known gaps</text>
<text x="216.0" y="738" text-anchor="middle" class="body">No raw exports in public Git</text>
<path d="M216 340 V425" class="edge"/>
<path d="M216 545 V630" class="edge"/>
<rect x="446" y="230" width="560" height="110" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="726.0" y="263" text-anchor="middle" class="head">Orchestrator</text>
<text x="726.0" y="292" text-anchor="middle" class="body">Scope · Contracts · Permissions · Budget</text>
<text x="726.0" y="315" text-anchor="middle" class="body">Checkpoints · State · Bounded retries</text>
<rect x="446" y="425" width="250" height="140" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="571.0" y="458" text-anchor="middle" class="head">Executor</text>
<text x="571.0" y="487" text-anchor="middle" class="body">Analyze · Design</text>
<text x="571.0" y="510" text-anchor="middle" class="body">Implement · Test</text>
<text x="571.0" y="533" text-anchor="middle" class="body">Candidate + test evidence</text>
<rect x="756" y="425" width="250" height="140" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
<text x="881.0" y="458" text-anchor="middle" class="head">Independent reviewer</text>
<text x="881.0" y="487" text-anchor="middle" class="body">Inspect pinned source</text>
<text x="881.0" y="510" text-anchor="middle" class="body">Reproduce critical checks</text>
<text x="881.0" y="533" text-anchor="middle" class="body">PASS / REWORK / BLOCKED</text>
<path d="M726 340 V382 H571 V425" class="edge"/>
<path d="M726 382 H881 V425" class="edge"/>
<path d="M696 490 H756" class="edge"/>
<text x="726" y="477" text-anchor="middle" class="label">handoff</text>
<rect x="586" y="665" width="280" height="105" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="726.0" y="698" text-anchor="middle" class="head">Quality gate</text>
<text x="726.0" y="727" text-anchor="middle" class="body">Candidate + independent review</text>
<text x="726.0" y="750" text-anchor="middle" class="body">Evidence meets agreed criteria</text>
<path d="M571 565 V610 H650 V665" class="edge"/>
<path d="M881 565 V610 H802 V665" class="edge"/>
<path d="M586 717 H432 V285 H446" class="edge"/>
<text x="490" y="636" text-anchor="middle" class="label">Rework within</text>
<text x="490" y="656" text-anchor="middle" class="label">attempt budget</text>
<rect x="466" y="845" width="520" height="90" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
<text x="726.0" y="878" text-anchor="middle" class="head">Missing evidence or unresolved disagreement?</text>
<text x="726.0" y="907" text-anchor="middle" class="body">BLOCK advancement · Escalate to the human owner</text>
<path d="M726 770 V845" class="edge"/>
<path d="M376 700 H405 V285 H446" class="edge"/>
<text x="281" y="811" text-anchor="middle" class="label">Evidence stays private; reviewers</text>
<text x="281" y="832" text-anchor="middle" class="label">need independent source access.</text>
<rect x="1076" y="230" width="308" height="110" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
<text x="1230.0" y="263" text-anchor="middle" class="head">Human approval</text>
<text x="1230.0" y="292" text-anchor="middle" class="body">Exact revision · Scoped action</text>
<text x="1230.0" y="315" text-anchor="middle" class="body">Risks and limits recorded</text>
<path d="M866 717 H1045 V285 H1076" class="approve"/>
<text x="949" y="690" text-anchor="middle" class="label">Technical pass</text>
<rect x="1076" y="425" width="308" height="120" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="1230.0" y="458" text-anchor="middle" class="head">Target implementation</text>
<text x="1230.0" y="487" text-anchor="middle" class="body">Chosen language and runtime</text>
<text x="1230.0" y="510" text-anchor="middle" class="body">UI technology is a decision</text>
<rect x="1076" y="630" width="308" height="140" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="1230.0" y="663" text-anchor="middle" class="head">Equivalence &amp; operations</text>
<text x="1230.0" y="692" text-anchor="middle" class="body">Controlled legacy/target checks</text>
<text x="1230.0" y="715" text-anchor="middle" class="body">Data · Recovery · Security</text>
<text x="1230.0" y="738" text-anchor="middle" class="body">Performance · Rollback</text>
<rect x="1076" y="845" width="308" height="90" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
<text x="1230.0" y="878" text-anchor="middle" class="head">Human release decision</text>
<text x="1230.0" y="907" text-anchor="middle" class="body">Exact release + environment</text>
<path d="M1230 340 V425" class="approve"/>
<path d="M1230 545 V630" class="edge"/>
<path d="M1230 770 V845" class="approve"/>
<text x="36" y="1003" text-anchor="start" class="sub">Design proposal only. No generated application or equivalence harness is supplied.</text>
<text x="36" y="1028" text-anchor="start" class="label">A technical PASS recommends advancement; human approval never substitutes for missing evidence.</text>
</svg>
